# 文档问答 Agent · 项目配置
# 说明：Streamlit Cloud 使用 uv 安装依赖，会优先读取本文件。
# 本地开发仍可用 uv pip install -r requirements.txt

[project]
name = "doc-qa-agent"
version = "0.1.0"
description = "文档问答 Agent · 基于 LangGraph + Streamlit"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40.0",
    "python-dotenv>=1.0.0",
    "openai>=1.60.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "faiss-cpu>=1.9.0",
    "dashscope>=1.20.0",
    "requests>=2.32.0",
]
